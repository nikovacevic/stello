[project]
name = "stello-terminal"
version = "0.1.0"
description = "A Textual TUI control plane for stello projects."
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60",
    "stello",
]

[tool.uv.sources]
# Resolves to the project repo root. When this project is cloned into
# ~/.stello/projects/stello and run via `stello run stello/terminal`, `../..` points at
# that clone's root — so the terminal app builds stello from the clone, not a dev checkout.
stello = { path = "../..", editable = true }
