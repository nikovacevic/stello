[project]
name = "stello"
dynamic = ["version"]
description = "Publish, share, and run Python applications locally — no infrastructure to deploy."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.scripts]
stello = "stello.cli:run_cli"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version is derived from git tags (e.g. `v0.2.0`) rather than hardcoded, so a tag
# is the single source of truth. At runtime it's read from installed package metadata
# (see stello/__init__.py). Between tags, a dev build resolves to something like
# `0.2.1.dev3+g<sha>`.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/stello"]
