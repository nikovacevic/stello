[project]
name = "stello"
version = "0.1.0"
description = "Publish, share, and run Python applications locally — no infrastructure to deploy."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Heavy UI deps for the built-in `stello terminal` / `stello dashboard` commands. Kept out
# of the core install; opt in with e.g. `uv tool install "stello[terminal,dashboard]"`.
terminal = ["textual>=0.60"]
dashboard = ["nicegui>=1.4"]

[project.scripts]
stello = "stello.cli:run_cli"

[dependency-groups]
# Dev pulls in both UI extras so `uv run stello terminal` / `dashboard` work in a checkout.
dev = [
    "pytest>=8",
    "textual>=0.60",
    "nicegui>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stello"]
