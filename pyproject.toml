[project]
name = "stello"
version = "0.1.0"
description = "Publish, share, and run Python applications locally — no infrastructure to deploy."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.scripts]
stello = "stello.cli:run_cli"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stello"]
