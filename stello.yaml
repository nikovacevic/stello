applications:
  - name: tui
    dir: ./apps/tui
    script: ./main.py
    args:
      - name: theme
        type: string
        default: dark
      - name: compact
        type: bool
        default: false
  - name: webui
    dir: ./apps/webui
    script: ./main.py
    args:
      - name: port
        type: int
        default: 8765
      - name: name
        type: string
        default: world
