applications:
  - name: stello
    dir: ./apps/stello
    script: ./main.py
    args:
      - name: theme
        type: string
        default: dark
      - name: compact
        type: bool
        default: false
  - name: control-plane
    dir: ./apps/control-plane
    script: ./main.py
    args:
      - name: port
        type: int
        default: 8080
