applications:
  - name: terminal
    dir: ./apps/stello-terminal
    script: ./main.py
    args:
      - name: theme
        type: string
        default: dark
      - name: compact
        type: bool
        default: false
  - name: stello
    dir: ./apps/stello-dashboard
    script: ./main.py
    args:
      - name: port
        type: int
        default: 8080
  - name: weather
    dir: ./apps/weather
    script: ./main.py
    args:
      - name: port
        type: int
        default: 8090
      - name: zip
        type: string
        default: "80302"
