applications:
  - name: terminal
    dir: ./apps/stello-terminal
    script: ./main.py
    args:
      - name: theme
        type: string
        default: dark
      - name: compact
        type: bool
        default: false
  - name: dashboard
    dir: ./apps/stello-dashboard
    script: ./main.py
    args:
      - name: port
        type: int
        default: 8080
      - name: theme
        type: string
        default: dark
